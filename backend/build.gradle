plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.3.1.8318'
	id 'org.owasp.dependencycheck' version '12.2.2'
}

group = 'com.picstore'
version = '0.0.1-SNAPSHOT'

ext['log4j2.version'] = '2.26.0'
ext['tomcat.version'] = '10.1.55'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Database
	runtimeOnly 'com.h2database:h2:2.2.224'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// PostgreSQL Driver for Gradle
	runtimeOnly 'org.postgresql:postgresql:42.7.11'

	// Extra dependencies for Spring Security and JSON Web Token (JWT) management
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5' // Allows JJWT to use Jackson for JSON processing
}

sonar {
	properties {
		property 'sonar.projectKey', 'picstore-backend'
		property 'sonar.projectName', 'Picstore Backend'
		property 'sonar.projectVersion', project.version
		property 'sonar.gradle.scanAll', 'true'
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.java.source', '21'
		property 'sonar.java.target', '21'
		property 'sonar.java.binaries', layout.buildDirectory.dir('classes/java/main').get().asFile
		property 'sonar.java.test.binaries', layout.buildDirectory.dir('classes/java/test').get().asFile
		property 'sonar.junit.reportPaths', layout.buildDirectory.dir('test-results/test').get().asFile
	}
}

dependencyCheck {
	failBuildOnCVSS = 7.0
	junitFailOnCVSS = 7.0
	formats = ['HTML', 'JSON', 'JUNIT']
	outputDirectory = layout.buildDirectory.dir('reports/dependency-check').get().asFile.toString()
	scanSet = [
		'src/main/resources',
		'../frontend/package.json',
		'../frontend/package-lock.json'
	]
	data.directory = "${System.getProperty('user.home')}/.gradle/dependency-check-data"
	analyzers.ossIndex.enabled = false

	if (project.hasProperty('nvdApiKey')) {
		nvd.apiKey = project.property('nvdApiKey')
	}
}

test {
	useJUnitPlatform()
	if (project.hasProperty('spring.profiles.active')) {
		systemProperty 'spring.profiles.active', project.property('spring.profiles.active')
	}
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('test')
}
