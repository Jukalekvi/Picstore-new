# PostgreSQL Database Connection Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/picstore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT signing key
jwt.secret=${JWT_SECRET_KEY}

# Browser clients allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}

# Permanent local disk folder configuration
upload.path=${UPLOAD_PATH:C:/Users/jukel/PicstoreImages/}

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable open-in-view for performance guidelines
spring.jpa.open-in-view=false

# Maximum allowed size for a single uploaded file
spring.servlet.multipart.max-file-size=8MB

# Maximum allowed size for a whole multipart/form-data request
spring.servlet.multipart.max-request-size=8MB
